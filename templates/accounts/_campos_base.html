<div class="form-group">
    <label class="form-label" for="{{ form.nome_completo.id_for_label }}">
        {{ form.nome_completo.label }}
    </label>
    {{ form.nome_completo }}
    {% if form.nome_completo.errors %}
    <div class="text-danger">{{ form.nome_completo.errors.0 }}</div>
    {% endif %}
</div>

<div class="form-group">
    <label class="form-label" for="{{ form.email.id_for_label }}">
        {{ form.email.label }}
    </label>
    {{ form.email }}
    {% if form.email.errors %}
    <div class="text-danger">{{ form.email.errors.0 }}</div>
    {% endif %}
</div>
