<div class="form-group">
    <label class="form-label" for="{{ form.senha.id_for_label }}">
        {{ form.senha.label }}
    </label>
    <div class="input-group">
        {{ form.senha }}
        <button class="btn-toggle-password" type="button" onclick="toggleSenhaCadastro(this)">
            <i class="bi bi-eye"></i>
        </button>
    </div>

    <div class="mt-2" id="forca_{{ id_sufixo }}" style="display: none;">
        <div class="progress-container">
            <div id="barra_{{ id_sufixo }}" class="progress-bar"></div>
        </div>
        <small id="txt_{{ id_sufixo }}" style="color: var(--texto-mutado); font-size: 0.8rem; margin-top: 2px; display: block;"></small>
    </div>

    {% if form.senha.errors %}
    <div class="text-danger">{{ form.senha.errors.0 }}</div>
    {% endif %}
    <div class="form-text">Mínimo 10 caracteres, contendo maiúscula, número e símbolo.</div>
</div>

<div class="form-group">
    <label class="form-label" for="{{ form.confirmar_senha.id_for_label }}">
        {{ form.confirmar_senha.label }}
    </label>
    <div class="input-group">
        {{ form.confirmar_senha }}
        <button class="btn-toggle-password" type="button" onclick="toggleSenhaCadastro(this)">
            <i class="bi bi-eye"></i>
        </button>
    </div>
    {% if form.confirmar_senha.errors %}
    <div class="text-danger">{{ form.confirmar_senha.errors.0 }}</div>
    {% endif %}
</div>
